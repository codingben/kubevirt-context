name: kubevirt-context
version: 0.1.0
description: Local KubeVirt organization context and read-only AI research tools
targets:
  - claude
  - codex
  - cursor
  - opencode
  - agent-skills
dependencies:
  apm: []
  mcp:
    - name: codegraph
      registry: false
      transport: stdio
      command: codegraph
      args: ["serve", "--mcp"]
    - name: github
      registry: false
      transport: stdio
      command: sh
      args: ["scripts/run-github-mcp.sh"]
includes: auto
