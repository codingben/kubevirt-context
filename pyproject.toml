[project]
name = "kubevirt-context"
version = "0.1.0"
description = "KubeVirt organization research workspace CLI"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[project.scripts]
workspace = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "workspace"]
